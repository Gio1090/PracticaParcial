<section id="inicio" class="hero container-fluid px-0">
  <div id="promociones" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#promociones" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#promociones" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#promociones" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="img/profesional-salud.jpg" class="d-block w-100 hero-image" alt="Profesional de la salud">
        <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 top-0">
          <p class="text-uppercase fw-semibold">Cuidamos tu bienestar</p>
          <h1 class="display-3 fw-bold mb-4">La salud que necesitas, cerca de ti</h1>
          <button class="btn btn-warning btn-lg" type="button" (click)="navegar('medicos')">
            Conoce al equipo
          </button>
        </div>
      </div>
      
      <div class="carousel-item">
        <img src="img/consulta-medica.jpg" class="d-block w-100 hero-image" alt="Consulta médica">
        <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 top-0">
          <p class="text-uppercase fw-semibold">Promoción del mes</p>
          <h2 class="display-4 fw-bold mb-4">Valoración integral con 20% de descuento</h2>
          <button class="btn btn-primary btn-lg" type="button" (click)="navegar('registro')">
            Reservar ahora
          </button>
        </div>
      </div>

      <div class="carousel-item">
        <img src="img/atencion-clinica.jpg" class="d-block w-100 hero-image" alt="Atención clínica">
        <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 top-0">
          <p class="text-uppercase fw-semibold">Atención personalizada</p>
          <h2 class="display-4 fw-bold mb-4">Primera consulta de fisioterapia sin costo de inscripción</h2>
          <button class="btn btn-primary btn-lg" type="button" (click)="navegar('registro')">
            Reservar ahora
          </button>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#promociones" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#promociones" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</section>
